<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>电脑本地错题导入助手</title>
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei", system-ui, sans-serif; background: #f4efe7; color: #2f2a24; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 18px; }
    main { width: min(760px, 100%); margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .lead { margin: 0 0 24px; color: #6f655a; line-height: 1.7; }
    .card { margin-bottom: 16px; padding: 22px; border: 1px solid #e0d6ca; border-radius: 16px; background: #fffdfa; box-shadow: 0 8px 24px rgba(70, 55, 40, .06); }
    .step { margin-bottom: 10px; color: #9a604b; font-size: 13px; font-weight: 700; letter-spacing: .08em; }
    h2 { margin: 0 0 10px; font-size: 19px; }
    p { margin: 8px 0; line-height: 1.65; }
    input[type=file] { display: block; width: 100%; margin-top: 12px; padding: 12px; border: 1px dashed #bbaea0; border-radius: 10px; background: #faf6f0; }
    .or { margin: 18px 0; color: #8b8176; text-align: center; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .summary { padding: 14px 16px; border-radius: 10px; background: #f7f1e8; color: #675d52; line-height: 1.7; overflow-wrap: anywhere; }
    .actions { display: flex; gap: 12px; margin-top: 18px; }
    button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px; font: inherit; font-weight: 700; cursor: pointer; }
    #prepareButton { flex: 1; color: white; background: #9a604b; }
    #prepareButton:disabled { cursor: not-allowed; opacity: .5; }
    #resetButton { color: #6f655a; background: #eee6dc; }
    .progress { height: 10px; margin-top: 16px; overflow: hidden; border-radius: 999px; background: #e8dfd5; }
    .progress > div { width: 0; height: 100%; background: #4f8f73; transition: width .15s ease; }
    #status { margin-top: 12px; min-height: 26px; line-height: 1.65; }
    .success { color: #39715a; }
    .error { color: #a13f32; }
    .note { color: #756a5f; font-size: 14px; }
    @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } .actions { flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <h1>电脑本地错题导入助手</h1>
    <p class="lead">文件只在这台电脑与微信开发者工具之间临时传递，不经过微信聊天，也不会保存在本地助手中。</p>

    <section class="card">
      <div class="step">推荐 · 一次选择整个文件夹</div>
      <h2>选择解压后的学生错题文件夹</h2>
      <p>文件夹中应包含 <b>confirmed.json</b> 和 <b>images</b> 文件夹。助手会自动忽略 pending.json 与 images/legacy。</p>
      <input id="folderInput" type="file" webkitdirectory multiple>

      <div class="or">或者分别选择</div>
      <div class="grid">
        <label>
          JSON 文件
          <input id="jsonInput" type="file" accept=".json,application/json">
        </label>
        <label>
          全部题目图片
          <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple>
        </label>
      </div>
    </section>

    <section class="card">
      <div class="step">检查并准备</div>
      <div id="summary" class="summary">尚未选择文件。</div>
      <div class="actions">
        <button id="prepareButton" type="button">准备给小程序读取</button>
        <button id="resetButton" type="button">重新选择</button>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
      <div id="status"></div>
      <p class="note">超过 850 KiB 的 PNG、JPEG、WebP 截图会在传递前自动等比例压缩，小图保持原样。显示“准备完成”后，回到微信开发者工具的批量导入页，点击“从电脑本地读取”。</p>
    </section>
  </main>

  <script>
    const BRIDGE_TOKEN = "__LOCAL_IMPORT_TOKEN__";
    const folderInput = document.getElementById("folderInput");
    const jsonInput = document.getElementById("jsonInput");
    const imageInput = document.getElementById("imageInput");
    const summary = document.getElementById("summary");
    const status = document.getElementById("status");
    const progressBar = document.getElementById("progressBar");
    const prepareButton = document.getElementById("prepareButton");
    const resetButton = document.getElementById("resetButton");

    let selectedJson = null;
    let selectedImages = [];
    let selectedDatasetLabel = "";
    let activeVersion = "";
    const IMAGE_SIZE_LIMIT = 850 * 1024;
    const MAX_CANVAS_PIXELS = 20 * 1024 * 1024;
    const MAX_CANVAS_SIDE = 8192;

    function apiFetch(url, options) {
      const config = Object.assign({}, options || {});
      const headers = new Headers(config.headers || {});
      headers.set("X-Local-Import-Token", BRIDGE_TOKEN);
      config.headers = headers;
      return fetch(url, config);
    }

    function basename(value) {
      const parts = String(value || "").split(/[\\/]/).filter(Boolean);
      return parts.length ? parts[parts.length - 1] : "";
    }

    function normalizeName(value) {
      return basename(value).trim().toLowerCase();
    }

    function isImage(file) {
      return /^image\//i.test(file.type || "") || /\.(png|jpe?g|webp|gif)$/i.test(file.name || "");
    }

    function formatBytes(value) {
      const bytes = Number(value) || 0;
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(bytes < 10 * 1024 ? 1 : 0)} KiB`;
      return `${(bytes / 1024 / 1024).toFixed(2)} MiB`;
    }

    function imageMime(file) {
      const name = String(file && file.name || "").toLowerCase();
      if (/\.png$/.test(name)) return "image/png";
      if (/\.jpe?g$/.test(name)) return "image/jpeg";
      if (/\.webp$/.test(name)) return "image/webp";
      const type = String(file && file.type || "").toLowerCase();
      return /^(image\/png|image\/jpeg|image\/webp)$/.test(type) ? type : "";
    }

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        const objectUrl = URL.createObjectURL(file);
        image.onload = () => {
          URL.revokeObjectURL(objectUrl);
          resolve(image);
        };
        image.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error(`无法读取图片：${file.name}`));
        };
        image.src = objectUrl;
      });
    }

    function canvasToBlob(canvas, mime, quality) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error("浏览器无法压缩这张图片。"));
        }, mime, quality);
      });
    }

    async function compressImage(file) {
      if (file.size <= IMAGE_SIZE_LIMIT) {
        return { file, compressed: false, originalSize: file.size, preparedSize: file.size };
      }

      const mime = imageMime(file);
      if (!mime) {
        throw new Error(`${file.name} 超过 850 KiB，且不是可自动压缩的 PNG、JPEG 或 WebP。`);
      }

      const image = await loadImage(file);
      const originalWidth = image.naturalWidth || image.width;
      const originalHeight = image.naturalHeight || image.height;
      if (!originalWidth || !originalHeight) throw new Error(`无法读取图片尺寸：${file.name}`);

      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d", { alpha: mime !== "image/jpeg" });
      if (!context) throw new Error("浏览器无法创建图片压缩画布。");

      const qualities = mime === "image/png" ? [undefined] : [0.9, 0.82, 0.74, 0.66, 0.58, 0.5, 0.42];
      let scale = Math.min(
        1,
        Math.sqrt(MAX_CANVAS_PIXELS / (originalWidth * originalHeight)),
        MAX_CANVAS_SIDE / originalWidth,
        MAX_CANVAS_SIDE / originalHeight
      );
      let smallestBlob = null;

      for (let attempt = 0; attempt < 20; attempt++) {
        const width = Math.max(1, Math.round(originalWidth * scale));
        const height = Math.max(1, Math.round(originalHeight * scale));
        canvas.width = width;
        canvas.height = height;
        context.clearRect(0, 0, width, height);
        context.drawImage(image, 0, 0, width, height);

        for (const quality of qualities) {
          const blob = await canvasToBlob(canvas, mime, quality);
          if (blob.type !== mime) {
            throw new Error(`${file.name} 无法在当前浏览器中保持原图片格式，请换用最新版 Edge 或 Chrome。`);
          }
          if (!smallestBlob || blob.size < smallestBlob.size) smallestBlob = blob;
          if (blob.size <= IMAGE_SIZE_LIMIT) {
            const preparedFile = new File([blob], file.name, {
              type: mime,
              lastModified: file.lastModified || Date.now(),
            });
            return {
              file: preparedFile,
              compressed: true,
              originalSize: file.size,
              preparedSize: preparedFile.size,
            };
          }
        }

        if (width === 1 && height === 1) break;
        const estimatedRatio = smallestBlob && smallestBlob.size
          ? Math.sqrt(IMAGE_SIZE_LIMIT / smallestBlob.size) * 0.92
          : 0.8;
        scale *= Math.max(0.5, Math.min(0.88, estimatedRatio));
      }

      throw new Error(`${file.name} 自动压缩后仍超过 850 KiB，请手动压缩后重试。`);
    }

    function pickJsonFromFolder(files) {
      const jsonFiles = files.filter((file) => /\.json$/i.test(file.name || ""));
      return jsonFiles.find((file) => normalizeName(file.name) === "confirmed.json")
        || jsonFiles.find((file) => /错题导入\.json$/i.test(file.name || ""))
        || jsonFiles.find((file) => normalizeName(file.name) !== "pending.json")
        || null;
    }

    function renderSelection() {
      const jsonLabel = selectedJson ? selectedJson.name : "未选择 JSON";
      summary.textContent = `资料：${selectedDatasetLabel || "待确认"}；JSON：${jsonLabel}；图片：${selectedImages.length} 张。`;
      status.textContent = "";
      status.className = "";
      progressBar.style.width = "0%";
    }

    folderInput.addEventListener("change", () => {
      const files = Array.from(folderInput.files || []);
      selectedJson = pickJsonFromFolder(files);
      const firstRelativePath = files.length ? String(files[0].webkitRelativePath || "").replace(/\\/g, "/") : "";
      selectedDatasetLabel = firstRelativePath.split("/")[0] || "";
      selectedImages = files.filter((file) => {
        const relativePath = String(file.webkitRelativePath || file.name || "").replace(/\\/g, "/");
        return isImage(file) && !/(^|\/)legacy\//i.test(relativePath);
      });
      jsonInput.value = "";
      imageInput.value = "";
      renderSelection();
    });

    jsonInput.addEventListener("change", () => {
      selectedJson = jsonInput.files && jsonInput.files[0] || null;
      selectedDatasetLabel = selectedJson ? selectedJson.name.replace(/\.json$/i, "") : "";
      renderSelection();
    });

    imageInput.addEventListener("change", () => {
      selectedImages = Array.from(imageInput.files || []).filter(isImage);
      renderSelection();
    });

    resetButton.addEventListener("click", async () => {
      folderInput.value = "";
      jsonInput.value = "";
      imageInput.value = "";
      selectedJson = null;
      selectedImages = [];
      selectedDatasetLabel = "";
      try {
        await apiFetch("/api/session" + (activeVersion ? "?version=" + encodeURIComponent(activeVersion) : ""), { method: "DELETE" });
      } catch (_) {}
      activeVersion = "";
      renderSelection();
    });

    async function readError(response) {
      let message = `请求失败（${response.status}）`;
      try {
        const data = await response.json();
        if (data && data.message) message = data.message;
      } catch (_) {}
      return message;
    }

    prepareButton.addEventListener("click", async () => {
      if (!selectedJson) {
        status.textContent = "请先选择 JSON 文件或整个学生错题文件夹。";
        status.className = "error";
        return;
      }
      prepareButton.disabled = true;
      status.className = "";
      status.textContent = "正在检查 JSON 和图片文件名……";
      progressBar.style.width = "0%";

      try {
        const importText = (await selectedJson.text()).replace(/^\uFEFF/, "");
        const parsed = JSON.parse(importText);
        const items = Array.isArray(parsed) ? parsed : parsed && parsed.mistakes;
        if (!Array.isArray(items) || !items.length || items.length > 50) {
          throw new Error("JSON 必须包含 1 至 50 道错题。");
        }

        const expected = [];
        const seenExpected = new Set();
        items.forEach((item) => {
          const name = basename(item && item.sourceImageName);
          const normalized = normalizeName(name);
          if (name && normalized && !seenExpected.has(normalized)) {
            seenExpected.add(normalized);
            expected.push({ name, normalized });
          }
        });

        const expectedNameSet = new Set(expected.map((item) => item.normalized));
        const selectedByName = new Map();
        const duplicateNames = [];
        selectedImages.forEach((file) => {
          const normalized = normalizeName(file.name);
          if (!normalized || !expectedNameSet.has(normalized)) return;
          if (selectedByName.has(normalized)) duplicateNames.push(file.name);
          selectedByName.set(normalized, file);
        });
        if (duplicateNames.length) throw new Error(`存在同名图片：${duplicateNames.join("、")}`);

        const missing = expected.filter((item) => !selectedByName.has(item.normalized)).map((item) => item.name);
        if (missing.length) throw new Error(`缺少 ${missing.length} 张截图：${missing.join("、")}`);

        const createResponse = await apiFetch("/api/session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            jsonFileName: selectedJson.name,
            datasetLabel: selectedDatasetLabel || selectedJson.name.replace(/\.json$/i, ""),
            importText,
          }),
        });
        if (!createResponse.ok) throw new Error(await readError(createResponse));
        const created = await createResponse.json();
        activeVersion = created.version;

        let compressedCount = 0;
        let originalImageBytes = 0;
        let preparedImageBytes = 0;
        for (let index = 0; index < expected.length; index++) {
          const item = expected[index];
          const file = selectedByName.get(item.normalized);
          status.textContent = file.size > IMAGE_SIZE_LIMIT
            ? `正在自动压缩图片 ${index + 1}/${expected.length}：${item.name}`
            : `正在准备图片 ${index + 1}/${expected.length}：${item.name}`;
          const prepared = await compressImage(file);
          originalImageBytes += prepared.originalSize;
          preparedImageBytes += prepared.preparedSize;
          if (prepared.compressed) compressedCount++;
          const uploadResponse = await apiFetch(`/api/image?name=${encodeURIComponent(item.name)}&version=${created.version}`, {
            method: "PUT",
            headers: { "Content-Type": imageMime(prepared.file) || prepared.file.type || "application/octet-stream" },
            body: prepared.file,
          });
          if (!uploadResponse.ok) throw new Error(await readError(uploadResponse));
          progressBar.style.width = `${expected.length ? (index + 1) * 100 / expected.length : 100}%`;
        }

        const readyResponse = await apiFetch("/api/ready", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ version: created.version }),
        });
        if (!readyResponse.ok) throw new Error(await readError(readyResponse));
        const ready = await readyResponse.json();
        progressBar.style.width = "100%";
        const compressionSummary = `自动压缩 ${compressedCount} 张；图片 ${formatBytes(originalImageBytes)} → ${formatBytes(preparedImageBytes)}`;
        status.textContent = `准备完成：${ready.questionCount} 道错题、${ready.imageCount} 张截图；${compressionSummary}。现在回到微信开发者工具点击“从电脑本地读取”。`;
        status.className = "success";
        summary.textContent = `JSON：${selectedJson.name}；错题：${ready.questionCount} 道；已匹配图片：${ready.imageCount} 张；${compressionSummary}。`;
      } catch (err) {
        status.textContent = err.message || "文件准备失败，请检查后重试。";
        status.className = "error";
      } finally {
        prepareButton.disabled = false;
      }
    });

    renderSelection();
  </script>
</body>
</html>
